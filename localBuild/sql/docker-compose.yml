version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "Test12345678*"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./backup/back.bak:/var/opt/mssql/backup/back.bak

  sqlcmd:
    image: mcr.microsoft.com/mssql-tools
    container_name: sqlcmd
    depends_on:
      - sqlserver
    volumes:
      - ./backup/back.bak:/var/opt/mssql/backup/back.bak
      - ./restore-database.sh:/usr/src/app/restore-database.sh
    entrypoint: /bin/bash -c "/usr/src/app/restore-database.sh"

volumes:
  sql_data:
